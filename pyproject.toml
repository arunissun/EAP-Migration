[project]
name = "eap-api-migration"
version = "0.1.0"
description = "Safety-first migration tooling for IFRC GO EAP records"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "reportlab>=4,<5",
    "tenacity>=9,<10",
    "typer>=0.15,<1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
eap-migrate = "eap_migration.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eap_migration"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
